  correct_background: False  # default is True
  sampler:
    type: weightedRandomSampler
    #num_samples: 100 # 500 #3000 #500 # 55000 #3000 # comment or delete this line if you want sampler to use length of dataset as num_samples
  required_data:
    image: image
    #image_bg: image_bg
    target: cell_class_labels
  target_grouping: # numbers in brackets correspond to the original classes in dcml/definitions/ml_score_to_int.json
  # The first classes must be for Multi-task learning, the last classes are for multiclass learning
    0: [ 1, 2, 3, 4, 5, 25, 28, 30, 16] #  16, 32 excluded ->RBC
    1: [3, 4, 5] # -> RBC aggregation
    2: [ 22 ] #  ->Nucleated_RBC
    3: [ 13, 14, 35, 36, 28, 29, 30, 31] #  31, 32 is excluded  -> Thrombocyte
    4: [30, 35, 36, 31] # -> thrombocyte aggregation 31 excluded
    5: [ 3, 4, 5, 35, 36, 28, 29, 30, 16, 12, 31] #   out 16, 12, 31, 32 are excluded -> Aggr always shares with some other class; Group of RBCs RBC_multiple ( RBC_doublet_and_no_or_small_thrombocytes (ml_score_r20) + RBC_triplet_and_no_or_small_thrombocytes (ml_score_r30) + RBC_multiple_and_no_or_small_thrombocytes(ml_score_rn0))
    6: [ 9, 10, 11, 8, 6, 29, 31, 12] # 16, 12, 31, 32 are excluded ->WBC. always shares with some other class
    #right next to the WBC class there should be WBC subtypes and nothing else
    7: [ 9 ] #  Eosinophil, should also appear in WBC, should follow MTL classes
    8: [ 11 ] #  Monocyte, should also appear in WBC
    9: [ 8 ] #  Neutrophil, should also appear in WBC
    10: [ 6 ] #  Lymphocyte, should also appear in WBC
    11: [ 10 ] # Basophil

  # Some images have indefinite appearance of the objects of specific categories.
  # For example 30: Thrombocyte clot and RBC(s) is indefinite for category 1: RBC aggregations
  unknowns_target_grouping_test:
    3: [12, 16, 5] # (3), (4), 5 are removed [ 3, 4, 5, 12, 16] # TODO 12 is out, can also be out here
    1: [30, 16]
    4: [28, 29, 12, 16, 5] #   (3), (4), 5 are removed  [28, 29, 3, 4, 5, 12, 16]
    7: [29, 16, 12, 31] # not neccessary needed
    8: [29, 16, 12, 31]
    9: [29, 16, 12, 31]
    10: [29, 16, 12, 31]
    11: [29, 16, 12, 31]

  # Some images have indefinite appearance of the objects of specific categories.
  # For example 30: Thrombocyte clot and RBC(s) is indefinite for category 1: RBC aggregations
  #
  # Additionally, for subclasses, like 1: RBC aggregation that is subclass of 0: RBC, for training
  # we ignore all images that do not have mather class object, 0: RBC, in our example. In that way 1: RBC aggreagtion
  # is trained only on images either with single or many RBCs. Ignored classes must be subset of ignored classes in
  # unknowns_target_grouping_test
  unknowns_target_grouping_train_val:
    3: [12, 16, 5] #  (3), (4), 5 are removed   # TODO 12 is out, can also be out here
    1: [ 30, 16, 22, 13, 14, 35, 36, 29, 9, 10, 11, 8, 6] #  [22, 13, 14, 35, 36, 29, 9, 11, 8, 6] - are removed # for new architecture
    4: [ 28, 29, 12, 16, 5, 1, 2, 25, 22, 9, 10, 11, 8, 6] # [1, 2, 25, 22, 9, 11, 8, 6 ] - are removed # 3, 4, 5 are removed for new architecture
    7: [ 29, 16, 12, 31, 1, 2, 3, 4, 5, 25, 28, 30, 22, 13, 14, 35, 36, 30 ]
    8: [ 29, 16, 12, 31, 1, 2, 3, 4, 5, 25, 28, 30, 22, 13, 14, 35, 36, 30 ]
    9: [ 29, 16, 12, 31, 1, 2, 3, 4, 5, 25, 28, 30, 22, 13, 14, 35, 36, 30 ]
    10: [ 29, 16, 12, 31, 1, 2, 3, 4, 5, 25, 28, 30, 22, 13, 14, 35, 36, 30 ]
    11: [ 29, 16, 12, 31, 1, 2, 3, 4, 5, 25, 28, 30, 22, 13, 14, 35, 36, 30 ]

  ml_score_to_int: # strings correspond to labels in the rtdc file collected with the manual annotation
    ml_score_r1f: 1 # RBC singlet focused
    ml_score_r1u: 2 # RBC singlet unfocused
    ml_score_r20: 3 # RBC doublet with no or small amount of thrombocyte(s)
    ml_score_r30: 4 # RBC triplet with no or small amount of thrombocyte(s)
    ml_score_rn0: 5 # RBC multiple with no or small amount of thrombocyte(s)
    ml_score_l10: 6 # Lymphocyte
    ml_score_g10: 7 #deprecated
    ml_score_g1n: 8 # Neutrophil
    ml_score_g1e: 9 # Eosinophil
    ml_score_g1b: 10 # Basophil
    ml_score_g1m: 11 # Monocyte
    ml_score_wn0: 12 # WBC multiple with no or small amount of thrombocyte(s)
    ml_score_t1f: 13 # Thrombocyte singlet focused
    ml_score_t1u: 14 # Thrombocyte singlet unfocused
    ml_score_m30: 15 #deprecated
    ml_score_mn0: 16 # Mixed cells (WBC+RBC + thr(s)) multiple with no or little thrombocyte(s)
    ml_score_ds0: 17 #deprecated
    ml_score_dl0: 18 #deprecated
    ml_score_tn0: 19 #deprecated - looks bad in the training set
    ml_score_m20: 20 #deprecated
    ml_score_buk: 21 #deprecated
    ml_score_r1n: 22 # Nucleated RBC
    ml_score_n10: 23 # Nucleus
    ml_score_r1s: 24 #deprecated
    ml_score_r1r: 25 # RBC singlet round
    ml_score_w10: 26 #deprecated
    ml_score_w20: 27 #deprecated
    ml_score_t1r: 28 # # RBC and a small amount of thrombocyte(s). This one could be confused with RBCs
    ml_score_t1w: 29 #deprecated (currently - because we don't know which WBC is it)
    ml_score_tnr: 30 # Thrombocyte clot and RBC(s)
    ml_score_tnw: 31 # Thrombocyte clot and WBC(s) # (sometimes also RBC appears there)
    ml_score_tnm: 32 # Thrombocyte clot and WBC(s) and RBC(s)
    ml_score_m3r: 33 #deprecated
    ml_score_m3w: 34 #deprecated
    ml_score_tns: 35 # Thrombocyte cluster - small
    ml_score_tnl: 36 # Thrombocyte cluster - large

  augmentation:
    ApplyRandomVerticalFlip:
      p: 0.5
#    ApplyInversion:
#      p: 0.5
#    AdjustSharpness:
#      sharpness_range:
#        - 0.0
#        - 1.0
#      p: 0.5
    AdjustGamma:
      gamma_range:
        - 0.85 #0.7 #0.5
        - 1.15 #1.5 #2.5
      p: 0.9
#    AdjustBrightnessMult:
#      brightness_range:
#        - 0.7 #0.85 #0.7 #
#        - 1.3 #1.15 #1.3 #
#      p: 0.9
    AdjustBrightnessShift:
      brightness_range:
        - -0.15 #0.2 #0.15 #-0.3 #
        - 0.15 #0.2 #0.15 #0.3 #
      p: 0.9
    AdjustContrast:
      contrast_range:
        - 0.8
        - 1.2
      p: 0.9
    ApplyInversion:
      p: 0.5
    ApplyGaussianBlur:
      kernel_size:
        - 3
        - 5
      sigma:
        - 0.5
        - 1.2 #1.2
      p: 0.5
    ApplyGaussianNoise:
      mean: 0.0
      sigma: 0.01 # 0.1
      p: 0.5
#    ApplyRandomRotation:
#      angle_limit: 10
#      p: 0.9

